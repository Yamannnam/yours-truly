<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yours truly — Bouquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0a0d;
    --bg-soft:#131019;
    --paper:#efe7da;
    --muted:#8d8494;
    --accent:#c9a24a;
    --accent-soft:#7a5f22;
    --line:rgba(239,231,218,.12);
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --arabic:"Amiri", "Cormorant Garamond", serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1b1522 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, #17121c 0%, transparent 55%),
      var(--bg);
    color:var(--paper);
    font-family:var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::after{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:99;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:3px 3px;
    mix-blend-mode:overlay;
  }
  .wrap{max-width:960px;margin:0 auto;padding:clamp(22px,5vw,64px);}
  .hidden{display:none !important;}
  .fade-in{animation:fade .9s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ---------- hero ---------- */
  .hero{
    min-height:92vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:26px;
  }
  .hero .kicker{
    letter-spacing:.5em;text-transform:uppercase;font-size:.72rem;
    color:var(--muted);padding-left:.5em;
  }
  .hero h1{
    font-size:clamp(3.4rem,13vw,8rem);line-height:.92;margin:0;
    font-weight:500;letter-spacing:.02em;
    background:linear-gradient(180deg,#fff8ec,#c9a24a 70%,#8a6a25);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{
    max-width:38ch;color:var(--muted);font-style:italic;
    font-size:clamp(1.05rem,2.6vw,1.35rem);line-height:1.6;margin:0;
  }
  .orn{color:var(--accent-soft);font-size:1.4rem;letter-spacing:.6em;}

  /* ---------- clickable bouquet ---------- */
  .bouquet{
    width:clamp(210px,44vw,320px);height:auto;display:block;
    cursor:pointer;overflow:visible;
    filter:drop-shadow(0 20px 44px rgba(0,0,0,.55));
    transition:filter .5s ease;
    animation:bbFloat 7s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
  }
  .bouquet:hover{filter:drop-shadow(0 0 32px rgba(201,162,74,.4));}
  .bouquet:focus-visible{outline:1px solid var(--accent);outline-offset:8px;border-radius:16px;}
  .bouquet .shadow{opacity:.32;}
  .tap{
    margin:-10px 0 0;font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--muted);transition:color .4s ease;
  }
  .bouquet:hover ~ .tap{color:var(--accent);}

  @keyframes bbSway{0%,100%{transform:rotate(-2.2deg);}50%{transform:rotate(2.2deg);}}
  .sprig{transform-box:view-box;transform-origin:150px 252px;animation:bbSway var(--dur,5s) ease-in-out infinite;animation-delay:var(--d,0s);}
  @keyframes bbBloom{0%{transform:scale(.12);opacity:0;}55%{opacity:1;}100%{transform:scale(1);opacity:1;}}
  .bloom{transform-box:fill-box;transform-origin:center;animation:bbBloom 1.7s cubic-bezier(.2,.85,.25,1) both;animation-delay:var(--bd,0s);}
  @keyframes bbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @media (prefers-reduced-motion:reduce){
    .sprig,.bouquet{animation:none;}
    .bloom{animation:bbBloom .01s both;}
  }
  button{
    font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;
  }
  .cta{
    border:1px solid var(--accent-soft);color:var(--paper);
    padding:14px 34px;border-radius:999px;letter-spacing:.28em;
    text-transform:uppercase;font-size:.74rem;
    transition:.35s ease;background:rgba(201,162,74,.05);
  }
  .cta:hover{background:var(--accent);color:#181207;border-color:var(--accent);
    box-shadow:0 0 40px rgba(201,162,74,.35);}

  /* ---------- library ---------- */
  .lib-head{text-align:center;margin:10px 0 46px;}
  .lib-head h2{margin:0 0 8px;font-size:clamp(2rem,6vw,3rem);font-weight:500;}
  .lib-head p{margin:0;color:var(--muted);font-style:italic;}
  .grid{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  }
  .piece{
    text-align:left;padding:26px 24px;border:1px solid var(--line);
    border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
    transition:.4s ease;position:relative;overflow:hidden;
  }
  .piece:hover{transform:translateY(-4px);border-color:rgba(201,162,74,.55);
    box-shadow:0 18px 50px rgba(0,0,0,.55);}
  .piece .num{font-size:.72rem;letter-spacing:.35em;color:var(--accent);}
  .piece h3{margin:12px 0 18px;font-size:1.6rem;font-weight:500;line-height:1.15;}
  .piece .song{font-size:.86rem;color:var(--muted);}
  .piece .song b{display:block;color:var(--paper);font-weight:500;font-style:italic;}
  .piece .go{
    position:absolute;right:18px;bottom:16px;color:var(--accent-soft);
    font-size:1.3rem;opacity:0;transform:translateX(-6px);transition:.4s ease;
  }
  .piece:hover .go{opacity:1;transform:none;}

  /* ---------- reader ---------- */
  .reader-top{
    display:flex;justify-content:space-between;align-items:center;
    gap:16px;flex-wrap:wrap;margin-bottom:34px;
  }
  .back{
    letter-spacing:.24em;text-transform:uppercase;font-size:.72rem;
    color:var(--muted);transition:.3s;padding:8px 0;
  }
  .back:hover{color:var(--accent);}
  .eyebrow{font-size:.78rem;letter-spacing:.4em;color:var(--accent);}
  .reader h2{
    font-size:clamp(2.2rem,7vw,4rem);font-weight:500;margin:6px 0 30px;
    line-height:1.05;
  }
  .poem{
    white-space:pre-wrap;font-size:clamp(1.12rem,2.5vw,1.32rem);
    line-height:2;color:#e6ddcd;margin:0 0 42px;
  }
  .poem.rtl{direction:rtl;text-align:right;font-family:var(--arabic);font-size:clamp(1.3rem,3vw,1.7rem);line-height:2.2;}

  .player{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:22px 4px;display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex-wrap:wrap;margin-bottom:40px;
  }
  .track{flex:1 1 200px;min-width:0;}
  .track b{display:block;font-size:1.12rem;font-weight:500;font-style:italic;}
  .track span{font-size:.84rem;color:var(--muted);letter-spacing:.08em;}
  .spotify{
    display:inline-flex;align-items:center;gap:11px;text-decoration:none;
    color:#0b0a0d;background:#1db954;border:1px solid #1db954;
    padding:11px 24px;border-radius:999px;font-size:.76rem;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;
    transition:.35s ease;
  }
  .spotify svg{width:19px;height:19px;flex:0 0 auto;}
  .spotify:hover{background:#1ed760;border-color:#1ed760;transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(29,185,84,.35);}
  .foot{text-align:center;color:var(--accent-soft);font-size:1.3rem;margin:40px 0 10px;}
</style>
</head>

const hero = document.getElementById("hero");
const library = document.getElementById("library");
const reader = document.getElementById("reader");
const enterBouquet = document.getElementById("enterBouquet");
const backButton = document.getElementById("backButton");
const readerTitle = document.getElementById("readerTitle");
const readerEyebrow = document.getElementById("readerEyebrow");
const readerText = document.getElementById("readerText");
const trackTitle = document.getElementById("trackTitle");
const trackArtist = document.getElementById("trackArtist");
const spotifyLink = document.getElementById("spotifyLink");
const grid = document.getElementById("grid");

let currentPiece = 0;

// Build the library cards from the data.
pieces.forEach((piece, index) => {
  const btn = document.createElement("button");
  btn.className = "piece";
  btn.dataset.piece = String(index);
  btn.innerHTML =
    '<span class="num">' + String(index + 1).padStart(2, "0") + '</span>' +
    '<h3></h3>' +
    '<span class="song"><b></b></span><span class="go">→</span>';
  btn.querySelector("h3").textContent = piece.title;
  btn.querySelector(".song b").textContent = piece.song + " — " + piece.artist;
  btn.addEventListener("click", () => openPiece(index));
  grid.appendChild(btn);
});

function openLibrary() {
  hero.classList.add("hidden");
  library.classList.remove("hidden");
  library.classList.add("fade-in");
  window.scrollTo({ top: 0, behavior: "instant" });
}

function openPiece(index) {
  currentPiece = index;
  const piece = pieces[index];

  readerEyebrow.textContent = String(index + 1).padStart(2, "0");
  readerTitle.textContent = piece.title;
  readerText.textContent = piece.text;
  trackTitle.textContent = piece.song;
  trackArtist.textContent = piece.artist;
  readerText.classList.toggle("rtl", /[\u0600-\u06FF]/.test(piece.text));

  spotifyLink.href = piece.spotify;

  library.classList.add("hidden");
  reader.classList.remove("hidden");
  reader.classList.add("fade-in");
  window.scrollTo({ top: 0, behavior: "instant" });
}

function goBack() {
  reader.classList.add("hidden");
  library.classList.remove("hidden");
  library.classList.add("fade-in");
  window.scrollTo({ top: 0, behavior: "instant" });
}

enterBouquet.addEventListener("click", openLibrary);

const bouquetSVG = document.getElementById("bouquetSVG");
bouquetSVG.addEventListener("click", openLibrary);
bouquetSVG.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openLibrary();
  }
});
backButton.addEventListener("click", goBack);
</script>
